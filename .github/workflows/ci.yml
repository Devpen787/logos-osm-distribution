name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Registry guest tests
        run: cargo test --manifest-path methods/guest/Cargo.toml
      - name: Registry IDL freshness
        run: |
          cargo run --quiet -p osm-registry-idl > /tmp/osm-registry.idl.json
          diff -u artifacts/osm-registry.idl.json /tmp/osm-registry.idl.json
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
